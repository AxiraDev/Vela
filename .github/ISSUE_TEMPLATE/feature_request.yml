name: Feature request
description: Suggest an improvement to Vela.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the task you are trying to complete.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Explain the behavior you would find useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
